<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career List</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Available Careers</h2>
    <table>
      <thead>
        <tr>
          <th>Career Name</th>
          <th>Description</th>
          <th>Required Skills</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Software Developer</td>
          <td>Design, develop, and maintain software systems.</td>
          <td>Programming, Problem-solving, Teamwork</td>
        </tr>
        <tr>
          <td>Data Analyst</td>
          <td>Analyze and interpret complex datasets.</td>
          <td>Excel, SQL, Data Visualization</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
