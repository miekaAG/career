<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    form { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; }
    button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Add New Career</h2>
    <form action="/add-career" method="POST">
      <label for="career_name">Career Name:</label>
      <input type="text" id="career_name" name="career_name" required>
      
      <label for="description">Description:</label>
      <textarea id="description" name="description" rows="4" required></textarea>
      
      <label for="required_skills">Required Skills:</label>
      <textarea id="required_skills" name="required_skills" rows="3" required></textarea>
      
      <button type="submit">Add Career</button>
    </form>
  </div>
</body>
</html>
