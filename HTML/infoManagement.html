<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information Management</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background-color: #f8f8f8; }
    button { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; }
    .add-button { background-color: #28a745; color: white; margin-bottom: 10px; }
    .edit-button { background-color: #ffc107; }
    .delete-button { background-color: #dc3545; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Manage Your Career Information</h2>
    <button class="add-button" onclick="openAddForm()">Add New Career Path</button>
    <table>
      <thead>
        <tr>
          <th>Career Name</th>
          <th>Description</th>
          <th>Required Skills</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Software Developer</td>
          <td>Design, develop, and maintain software systems.</td>
          <td>Programming, Problem-solving, Teamwork</td>
          <td>
            <button class="edit-button" onclick="editEntry()">Edit</button>
            <button class="delete-button" onclick="deleteEntry()">Delete</button>
          </td>
        </tr>
        <!-- Additional rows will be dynamically added here -->
      </tbody>
    </table>
  </div>

  <script>
    function openAddForm() {
      alert("Open a form to add new career information.");
    }

    function editEntry() {
      alert("Open a form to edit this entry.");
    }

    function deleteEntry() {
      if (confirm("Are you sure you want to delete this entry?")) {
        alert("Entry deleted.");
      }
    }
  </script>
</body>
</html>
